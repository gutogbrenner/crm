.sb{overflow:auto;padding:18px 20px;flex:1}.hint{color:var(--pri);font-size:12.5px;margin-bottom:12px}

.sb textarea{width:100%;min-height:56px;margin-top:6px;background:var(--in);border:1px solid var(--bd);border-radius:9px;color:var(--tx);padding:9px 11px;font:inherit;font-size:13.5px;resize:vertical}
.nt{color:var(--mu);font-style:italic;font-size:13px}.rs{margin-top:20px;background:none;border:1px solid var(--bd);color:var(--mu);border-radius:8px;padding:7px 12px;font:inherit;font-size:12px;cursor:pointer}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin:20px 0}
.kp .card{padding:18px}.kp small{color:var(--mu);font-size:13px}.kp strong{display:block;font-size:34px;font-weight:800;line-height:1.1;margin:4px 0}

.pl2{background:var(--in);border:1px solid var(--bd);color:var(--tx);border-radius:10px;padding:11px 16px;font:inherit;font-weight:600;cursor:pointer}
.dl{border:1px solid var(--bd);border-radius:12px;padding:12px;margin:10px 0}.dl .ma{margin-top:10px}

.srch{flex:1;min-width:240px;background:var(--card);border:1px solid var(--bd);color:var(--tx);border-radius:10px;padding:11px 14px;font:inherit}

.lt{margin:0;font-size:19px;font-weight:800}.bt{margin:16px 0 6px;color:var(--pri);font-size:14px;text-transform:uppercase;letter-spacing:.3px}

:root{--bg:#0f1614;--sb:rgba(3,10,7,.5);--card:rgba(7,18,13,.55);--bd:rgba(190,255,225,.14);--ln2:rgba(190,255,225,.24);--tx:#effff6;--mu:#8fb3a2;--pr:#5dbb92;--pri:#9fd8bd;--in:rgba(2,8,6,.5);--cy:#a9c98a}

.x-goal{display:flex;align-items:center;gap:12px;border:1px solid var(--bd);border-radius:40px;padding:5px 18px 5px 7px;height:48px;background:rgba(4,12,9,.5);backdrop-filter:blur(18px);color:var(--tx);font:inherit;cursor:pointer;text-align:left}
.x-ring{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;box-shadow:0 0 16px rgba(93,187,146,.4)}
.x-ring:after{content:"";width:25px;height:25px;border-radius:50%;background:#040a07}
.x-goal b{font:500 15px Inter,system-ui,-apple-system,'Segoe UI',sans-serif;display:block;line-height:1.2}.x-goal small{color:var(--mu);font-size:11.5px}
/* fila de liga&#231;&#227;o */
.x-grid{display:grid;grid-template-columns:minmax(0,1fr) 520px;gap:26px;align-items:start}
.x-lb{font:500 10.5px Inter,system-ui,-apple-system,'Segoe UI',sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#84a595}
.x-lead{padding:28px 30px;position:relative}
.x-lead:before{content:"";position:absolute;left:30px;right:30px;top:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--pr),transparent)}
.x-chips{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.x-chip{font:500 10.5px Inter,system-ui,-apple-system,'Segoe UI',sans-serif;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--ln2);border-radius:20px;padding:5px 11px;color:var(--mu);max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.x-chip.ok{color:#7fcfa8;border-color:rgba(127,207,168,.45)}
.x-quota{margin-left:auto;display:flex;gap:14px;align-items:center;font:500 10.5px Inter,system-ui,-apple-system,'Segoe UI',sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#9fc2b1}
.x-quota i{display:inline-block;width:8px;height:8px;border-radius:50%;border:1px solid #6fa58c;margin-left:5px;vertical-align:middle}.x-quota i.d{background:var(--cy);border-color:var(--cy);box-shadow:0 0 8px var(--cy)}
.x-kick{font:400 13.5px Inter,system-ui,-apple-system,'Segoe UI',sans-serif;letter-spacing:.1em;color:#b9ffd9;margin-bottom:4px}
.x-name{margin:0;font-size:29px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;line-height:1.2}
.x-who{color:var(--mu);margin-top:6px;font-size:14.5px}
.x-call{display:flex;align-items:center;gap:22px;margin:24px 0;padding:18px 22px 18px 18px;border:1px solid var(--bd);border-radius:40px;background:rgba(3,10,7,.35);flex-wrap:wrap}
.x-pbtn{width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,#a9c98a,#5dbb92);display:grid;place-items:center;box-shadow:0 0 0 6px rgba(93,187,146,.14),0 0 34px rgba(93,187,146,.7);flex:none}
.x-pbtn svg{width:24px;height:24px;fill:#fff}
.x-num{font:500 36px Inter,system-ui,-apple-system,'Segoe UI',sans-serif;letter-spacing:-.02em;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.x-num input{width:74px;background:none;border:0;border-bottom:1px dashed transparent;color:var(--pr);font:inherit;text-shadow:0 0 18px rgba(93,187,146,.8);padding:0;outline:0}
.x-num input:hover,.x-num input:focus{border-bottom-color:var(--pr)}
.x-alt{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.x-gh{border:1px solid var(--ln2);border-radius:30px;padding:6px 13px;font:inherit;font-size:12.5px;color:#b9d6c8;background:none;cursor:pointer;text-decoration:none;white-space:nowrap}
.x-gh:hover{color:#fff;border-color:#fff}.x-gh.on{background:rgba(93,187,146,.22);border-color:var(--pr);color:#fff}
.x-gh.wa{color:#7fcfa8;border-color:rgba(127,207,168,.4)}
.x-gh:disabled{opacity:.35;cursor:default}
.x-qr{margin-left:auto;width:112px;border-radius:18px;background:#fff;padding:9px;cursor:pointer;flex:none}.x-qr.big{width:230px}.x-qr svg{width:100%;height:auto;display:block}
.x-info{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px 20px}
.x-info b{display:block;font-weight:500;font-size:14px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.x-info a{color:var(--tx);text-decoration:none}
.x-res{margin-top:22px;padding:20px 24px}
.x-sts{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:12px}
.x-st{height:52px;border-radius:40px;border:1px solid var(--ln2);display:flex;align-items:center;gap:8px;padding:0 14px;font:inherit;font-weight:500;font-size:12.5px;line-height:1.2;background:none;cursor:pointer;text-align:left}
.x-st u{width:8px;height:8px;border-radius:50%;flex:none;box-shadow:0 0 12px currentColor;background:currentColor}
.x-st span{color:var(--tx)}
.x-st kbd{margin-left:auto;font-size:10.5px;border:1px solid var(--ln2);border-radius:6px;padding:2px 6px;color:var(--mu)}
.x-st:hover{border-color:currentColor}
.x-st.sel{border-color:currentColor;box-shadow:0 0 18px -4px currentColor,inset 0 0 0 1px currentColor}
.x-st.pri{background:var(--pr);border-color:var(--pr);box-shadow:0 0 26px rgba(93,187,146,.55)}.x-st.pri span{color:#fff}.x-st.pri kbd{border-color:rgba(255,255,255,.4);color:#fff}
.x-st.pri.sel{box-shadow:0 0 0 3px rgba(255,255,255,.75),0 0 26px rgba(93,187,146,.7)}
.x-q{display:flex;align-items:center;gap:14px;margin-top:18px;flex-wrap:wrap}
.x-bar{flex:1;min-width:160px;height:8px;border-radius:6px;display:flex;gap:1px;overflow:hidden}
.x-bar i{flex:1;height:100%;background:#15281e;cursor:pointer;min-width:1px}.x-bar i.cur{background:#fff!important;box-shadow:0 0 8px #fff}
.x-cnt{font:12px Inter,system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--mu)}
.x-nav{display:flex;gap:8px}
.x-nx{font-size:12px;color:var(--mu);margin-top:12px}.x-nx b{color:#e3fff0;font-weight:500}
/* roteiro */
.sp{padding:0;display:flex;flex-direction:column;position:sticky;top:18px;max-height:calc(100vh - 36px);overflow:hidden}
.sp.full{position:fixed;inset:14px;z-index:30;max-height:none;background:rgba(5,11,8,.96)}
.sh{display:flex;align-items:center;padding:16px 22px;border-bottom:1px solid var(--bd);gap:12px;flex-wrap:wrap}
.x-rt{font-weight:600;font-size:15px}
.x-tg{display:flex;border:1px solid var(--ln2);border-radius:30px;padding:3px}.x-tg button{font:inherit;font-size:11.5px;padding:4px 12px;border-radius:30px;color:var(--mu);background:none;border:0;cursor:pointer}.x-tg .on{background:var(--pr);color:#fff}
.x-steps{display:flex;gap:6px;padding:14px 22px 0}.x-steps span{flex:1;height:3px;border-radius:3px;background:#0f1f17}.x-steps .d{background:var(--pr);box-shadow:0 0 10px rgba(93,187,146,.7)}.x-steps .c{background:var(--cy)}
.sb{padding:16px 22px;flex:1;overflow:auto;max-height:none}
.x-blk{margin-bottom:22px}
.x-pitch{font:400 15px/1.6 Inter,system-ui,-apple-system,'Segoe UI',sans-serif;color:#e3fff0;padding:8px 0 12px;border-bottom:1px solid var(--bd);margin-bottom:8px}
.x-hint{font-size:12px;color:var(--mu);margin:2px 0 8px}
.x-qq{font-weight:500;margin:16px 0 7px;font-size:14px;line-height:1.4}.x-qq em{font:500 11px Inter,system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--pr);font-style:normal;margin-right:8px}
.x-es{text-decoration:none;font:500 9px Inter,system-ui,-apple-system,'Segoe UI',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--cy);border:1px solid rgba(169,201,138,.4);border-radius:20px;padding:2px 8px;margin-left:8px;white-space:nowrap;vertical-align:middle}
.x-qk{display:flex;gap:6px;margin:0 0 8px;flex-wrap:wrap}.x-qk button{font:inherit;font-size:11.5px;border:1px solid var(--ln2);border-radius:30px;padding:4px 11px;color:#b9d6c8;background:none;cursor:pointer}
.x-sc{display:flex;gap:5px;margin:0 0 8px}.x-sc button{flex:1;height:32px;border-radius:10px;border:1px solid var(--ln2);font:500 12.5px Inter,system-ui,-apple-system,'Segoe UI',sans-serif;color:#b9d6c8;background:none;cursor:pointer;padding:0}
.x-qk button.on,.x-sc button.on{background:var(--pr);border-color:var(--pr);color:#fff;box-shadow:0 0 16px rgba(93,187,146,.5)}
.x-ta{display:block;width:100%;border:1px solid var(--bd);border-radius:22px;background:rgba(2,8,6,.45);min-height:44px;padding:11px 18px;color:#dff3e9;font:inherit;font-size:13.5px;resize:vertical;outline:0}
.x-ta:focus{border-color:var(--pr);box-shadow:0 0 0 3px rgba(93,187,146,.16),0 0 22px rgba(93,187,146,.25)}
.sf{border-top:1px solid var(--bd);padding:12px 22px;display:flex;align-items:center;color:var(--mu);font-size:12.5px;gap:8px}
.x-sres{display:flex;flex-direction:column;gap:6px;margin-top:12px;max-height:46vh;overflow:auto}
.x-sres button{text-align:left;background:none;border:1px solid var(--bd);border-radius:16px;padding:9px 14px;color:var(--tx);font:inherit;cursor:pointer}.x-sres button:hover{border-color:var(--pr)}.x-sres span{display:block;color:var(--mu);font-size:12px}
.gb{background:#0f1f17}.gb i{background:linear-gradient(90deg,#5dbb92,#a9c98a)}
@media(max-width:1250px){.x-grid{grid-template-columns:1fr}.sp{position:static;max-height:none}.x-sts{grid-template-columns:1fr 1fr}.x-info{grid-template-columns:1fr 1fr}}
@media(max-width:800px){aside{width:100%;flex-direction:row;padding:10px 14px;height:auto}.x-logo{margin:0 8px 0 0}#usr{margin:0 0 0 auto}#conn{margin:0 0 0 8px}.nav.on:before{display:none}main{padding:16px 12px}.x-srch{min-width:0;margin-left:0;flex:1}.x-num{font-size:26px}.x-name{font-size:22px;letter-spacing:.1em}.x-qr{margin-left:0}#cmsg{left:12px}}
.sb .x-ta{min-height:44px;height:44px;resize:none;overflow:hidden}
.x-st{padding:0 12px}
.x-chip.w{color:#ffb454;border-color:rgba(255,180,84,.45)}

.sv:not(.alt),.seg button.on,.x-tg .on,.x-qk button.on,.x-sc button.on,.nav .bd,.mini.on{color:#03170e!important}
.seg button.on b{color:#0a3a25}
.x-st.pri span{color:#03170e}.x-st.pri kbd{border-color:rgba(3,23,14,.45);color:#03170e}
.x-st.pri.sel{box-shadow:0 0 0 3px rgba(255,255,255,.8),0 0 26px rgba(93,187,146,.7)}
.x-pbtn{background:linear-gradient(135deg,#a9c98a,#5dbb92)}.x-pbtn svg{fill:#03170e}
.x-logo{font-size:21px;font-weight:600;font-family:Inter,system-ui,-apple-system,'Segoe UI',sans-serif;letter-spacing:0}
.x-gh.wa{color:#9fd8bd;border-color:rgba(159,216,189,.4)}
